<title>Leri Sranan & English</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Apprendre et réviser le sranan tongo et l'anglais depuis le français : leçons, vocabulaire, révision espacée, exercices, dialogues, test de niveau.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: application shell — a rail on wide screens, a sticky tab strip on phones.
   The one bold gesture is the pangi cloth (striped Maroon textile) on the brand mark and the home hero; everything else stays quiet. */
:root{
  --bg:#F2F5F0;
  --surface:#FFFFFF;
  --surface-2:#E6ECE4;
  --line:#D2DCD0;
  --line-strong:#AFBFAE;
  --fg:#14231A;
  --muted:#4D6255;
  --green:#1F6B45;
  --on-green:#FFFFFF;
  --green-soft:#D9EEDF;
  --red:#AE2436;
  --red-soft:#F8DFE2;
  --gold:#C99312;
  --gold-soft:#FBEFC8;
  --blue:#2B5797;
  --cloth-ink:#17211B;
  --cloth-paper:#F7F3E8;
  --focus:#C99312;
  --shadow:0 1px 2px rgba(20,35,26,.06),0 6px 20px rgba(20,35,26,.06);
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1611; --surface:#142019; --surface-2:#1B2A21; --line:#26372C; --line-strong:#3A5042;
    --fg:#E5EEE7; --muted:#9BB1A3; --green:#5DBE86; --on-green:#07130C; --green-soft:#16301F;
    --red:#EE6F7D; --red-soft:#3A1A20; --gold:#F0C446; --gold-soft:#372D12; --blue:#7EA3E0;
    --cloth-ink:#0A0F0C; --cloth-paper:#E9E3D2; --focus:#F0C446;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1611; --surface:#142019; --surface-2:#1B2A21; --line:#26372C; --line-strong:#3A5042;
  --fg:#E5EEE7; --muted:#9BB1A3; --green:#5DBE86; --on-green:#07130C; --green-soft:#16301F;
  --red:#EE6F7D; --red-soft:#3A1A20; --gold:#F0C446; --gold-soft:#372D12; --blue:#7EA3E0;
  --cloth-ink:#0A0F0C; --cloth-paper:#E9E3D2; --focus:#F0C446;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:17px;line-height:1.55;margin:0}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,4.4vw,2.6rem);font-weight:800}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.12rem;font-weight:700}
p{margin:0}
a{color:var(--green)}
button{font:inherit;color:inherit}
:is(a,button,input,select,textarea,[tabindex]):focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sr{font-family:var(--font-display);font-weight:700;color:var(--green)}
.pron{font-family:var(--font-mono);font-size:.8rem;color:var(--muted);letter-spacing:.01em}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-lg{display:flex;flex-direction:column;gap:32px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.prose{max-width:66ch}
div.prose,ol.prose,ul.prose{display:flex;flex-direction:column;gap:12px}
.prose b{font-weight:700}

/* Shell */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:start;display:flex;flex-direction:column;gap:20px;
  background:var(--surface);border-right:1px solid var(--line);
  padding-block:22px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;overflow-y:auto}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.brand-mark{width:34px;height:34px;border-radius:9px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.brand-name{font-family:var(--font-display);font-weight:800;font-size:1.08rem;line-height:1.05}
.brand-name small{display:block;font-family:var(--font-body);font-weight:600;font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--fg);font-weight:600;white-space:nowrap}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--green-soft);color:var(--green)}
.course-switch{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2)}
.course-switch button{flex:1;border:0;background:transparent;padding:8px 10px;border-radius:9px;font-weight:700;font-size:.92rem;cursor:pointer;color:var(--muted)}
.course-switch button[aria-pressed="true"]{background:var(--surface);color:var(--green);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pill.lvl{background:var(--green-soft);color:var(--green);font-family:var(--font-mono)}
.badge{font-size:.72rem;font-weight:700;background:var(--red);color:#fff;border-radius:99px;padding:1px 7px;font-variant-numeric:tabular-nums;line-height:1.4}
.nav .badge{margin-left:auto}
.sync{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted);background:none;border:0;padding:6px 4px;cursor:pointer;text-align:left}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--line-strong);flex:none}
.sync[data-s="synced"] i{background:var(--green)}
.sync[data-s="connecting"] i,.sync[data-s="slow"] i{background:var(--gold)}
.sync[data-s="error"] i{background:var(--red)}
.view{width:100%;max-width:940px;padding-block:32px calc(72px + var(--install-h, 0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));outline:none}

/* Barre d'onglets du téléphone */
.tabbar{display:none;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabbar a,.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;padding:6px 2px;
  font-size:.72rem;font-weight:700;color:var(--muted);text-decoration:none;background:none;border:0;cursor:pointer}
.tabbar svg{width:24px;height:24px}
.tabbar [aria-current="page"],.tabbar button.on,.tabbar button[aria-expanded="true"]{color:var(--green)}
.tabbar .tab-main .ic{display:grid;place-items:center;width:38px;height:38px;margin-top:-14px;border-radius:50%;background:var(--green);color:var(--on-green);box-shadow:var(--shadow)}
.tabbar .tab-main .ic svg{width:22px;height:22px}
.tabbar .badge{position:absolute;top:5px;left:calc(50% + 4px)}
.sheet{position:fixed;inset:0;z-index:35}
.sheet-backdrop{position:absolute;inset:0;background:rgba(5,12,8,.45);border:0;width:100%;cursor:pointer}
.sheet-panel{position:absolute;left:0;right:0;bottom:calc(61px + env(safe-area-inset-bottom,0px));background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  padding-block:18px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sheet-panel a{display:flex;align-items:center;padding:13px 14px;border-radius:12px;background:var(--surface-2);color:var(--fg);font-weight:700;text-decoration:none}
.sheet-panel a[aria-current="page"]{background:var(--green-soft);color:var(--green)}

@media (max-width:860px){
  .shell{display:block}
  .rail{position:static;height:auto;gap:0;border-right:0;border-bottom:1px solid var(--line);
    padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:visible}
  .rail .nav{display:none}
  .course-switch{margin-top:10px}
  .brand-mark{width:28px;height:28px;border-radius:7px}
  .sync{margin-top:0;padding:4px 0}
  .sync span{display:none}
  .sync.rail-sync{display:none}
  .view{padding-block:22px calc(100px + env(safe-area-inset-bottom,0px) + var(--install-h, 0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .tabbar{display:grid}
}
@media (min-width:861px){ .sheet{display:none} }
/* Bandeau d'installation (version site uniquement) */
.install{position:fixed;z-index:34;left:0;right:0;bottom:calc(61px + env(safe-area-inset-bottom,0px));padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:861px){.install{left:auto;right:24px;bottom:24px;width:420px;padding:0}}
.install-card{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--green);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.install-card img{border-radius:10px;flex:none}
.install-card svg{vertical-align:-3px}
@media (min-width:861px){ .sync.top-sync{display:none} }

/* Pangi cloth */
.cloth{
  background-color:var(--red);
  background-image:
    repeating-linear-gradient(0deg,transparent 0 22px,var(--cloth-ink) 22px 25px,transparent 25px 40px,var(--cloth-paper) 40px 43px,transparent 43px 58px),
    repeating-linear-gradient(90deg,var(--red) 0 26px,var(--cloth-ink) 26px 29px,var(--gold) 29px 43px,var(--cloth-paper) 43px 46px,var(--green) 46px 76px,var(--cloth-ink) 76px 79px,var(--blue) 79px 93px,var(--cloth-paper) 93px 96px);
}
.brand-mark.cloth{background-size:auto;background-position:-8px -6px}

/* Buttons & chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;font-weight:700;font-size:1rem;line-height:1.1;
  padding:.78em 1.15em;border-radius:11px;border:1.5px solid transparent;background:var(--green);color:var(--on-green);cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line-strong)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{padding:.5em .85em;font-size:.92rem;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;border:1.5px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:600;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.seg{display:inline-flex;border:1.5px solid var(--line-strong);border-radius:11px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:600;cursor:pointer;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--on-green)}

/* Surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:720px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s ease}
.bar.gold>i{background:var(--gold)}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--green)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.new{background:var(--gold-soft);color:var(--fg)}
.pill.warn{background:var(--red-soft);color:var(--red)}
.note{border-left:3px solid var(--gold);background:var(--gold-soft);padding:12px 14px;border-radius:0 12px 12px 0}
.empty{padding:28px;text-align:center;border:1.5px dashed var(--line-strong);border-radius:16px;color:var(--muted)}

/* Home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 200px;border-radius:20px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.hero-text{padding:30px 28px;display:flex;flex-direction:column;gap:14px}
.hero-text .lead{font-size:1.1rem;color:var(--muted);max-width:52ch}
.hero .cloth{min-height:100%}
@media (max-width:720px){.hero{grid-template-columns:minmax(0,1fr)}.hero .cloth{min-height:64px;order:-1}.hero-text{padding:22px 18px}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--font-display);font-size:1.7rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.85rem;color:var(--muted)}
.wotd .sr{font-size:2rem;line-height:1.1}
.celebr{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.celebr .num{font-family:var(--font-display);font-weight:800;font-size:2.2rem;color:var(--red);font-variant-numeric:tabular-nums;line-height:1}
.celebr .num small{display:block;font-size:.75rem;font-family:var(--font-body);color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}

/* Lists */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.list>*{padding:14px 18px;border-top:1px solid var(--line)}
.list>*:first-child{border-top:0}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;text-decoration:none;color:inherit}
a.lrow:hover{background:var(--surface-2)}
.lnum{font-family:var(--font-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.word{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px 16px;align-items:baseline}
.word .sr{font-size:1.08rem}
.word .fr{min-width:0}
.word .nt{grid-column:1 / -1;font-size:.88rem;color:var(--muted)}
@media (max-width:600px){.word{grid-template-columns:minmax(0,1fr) auto}.word .dots{grid-column:2;grid-row:1}.word .fr{grid-column:1 / -1}}
.theme-card{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.theme-card:hover{border-color:var(--line-strong)}
.theme-card h3{font-size:1.05rem}
.letter{font-family:var(--font-display);font-weight:800;color:var(--muted);font-size:.95rem;background:var(--surface-2)!important;padding-block:6px!important}

/* Lessons */
.lesson-body h3{margin-top:10px}
.ex{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.ex li{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:4px 18px;padding:11px 16px;border-top:1px solid var(--line);align-items:baseline}
.ex li:first-child{border-top:0}
.ex .s{display:flex;flex-direction:column;gap:1px;min-width:0}
.ex .sr{font-size:1.05rem}
@media (max-width:600px){.ex li{grid-template-columns:minmax(0,1fr)}}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%}
.tbl th,.tbl td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
.tbl thead th{border-top:0;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2)}
.tbl td.sr{font-size:1.02rem}

/* Exercises */
.qwrap{max-width:640px;display:flex;flex-direction:column;gap:18px}
.qhead{display:flex;align-items:center;gap:12px}
.qhead .bar{flex:1}
.qprompt{font-family:var(--font-display);font-weight:800;font-size:clamp(1.6rem,5vw,2.3rem);line-height:1.15;text-wrap:balance}
.qprompt.sr{color:var(--green)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:13px;border:1.5px solid var(--line-strong);background:var(--surface);cursor:pointer;font-size:1.05rem;font-weight:600}
.opt:hover:not([disabled]){border-color:var(--green)}
.opt kbd{font-family:var(--font-mono);font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;flex:none}
.opt.sr-opt{font-family:var(--font-display);color:var(--green)}
.opt.ok{background:var(--green-soft);border-color:var(--green)}
.opt.bad{background:var(--red-soft);border-color:var(--red)}
.opt[disabled]{cursor:default}
.feedback{padding:14px 16px;border-radius:13px;display:flex;flex-direction:column;gap:4px}
.feedback.ok{background:var(--green-soft)}
.feedback.bad{background:var(--red-soft)}
.feedback b{font-family:var(--font-display)}
.tin{width:100%;font:600 1.2rem var(--font-body);padding:14px 16px;border-radius:13px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--fg)}
.tin:focus{border-color:var(--green);outline:none}
.tokens{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border-radius:13px;border:1.5px dashed var(--line-strong);background:var(--surface)}
.tokens.pool{border-style:solid;background:var(--surface-2);border-color:transparent}
.tok{font-family:var(--font-display);font-weight:700;font-size:1.05rem;padding:8px 13px;border-radius:10px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--green);cursor:pointer}
.tok[disabled]{opacity:.25;cursor:default}

/* Flashcards */
.flash{min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:34px 22px;box-shadow:var(--shadow)}
.flash .big{font-family:var(--font-display);font-weight:800;font-size:clamp(2rem,7vw,3.2rem);line-height:1.1;text-wrap:balance}
.flash .big.sr{color:var(--green)}
.flash .ans{display:flex;flex-direction:column;gap:6px;align-items:center;padding-top:14px;border-top:1px solid var(--line);width:100%;max-width:440px}
.flash .ans .main{font-size:1.35rem;font-weight:700}
.grades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grades .btn{flex-direction:column;gap:2px;padding:.8em .5em}
.grades .btn small{font-weight:600;font-size:.75rem;opacity:.85}
.g-again{background:var(--red)!important;color:#fff!important}
.g-hard{background:var(--gold)!important;color:#1a1405!important}

/* Dialogues */
.dlg{display:flex;flex-direction:column;gap:12px}
.line{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:start}
.line .say{margin-top:8px}
.line.speaking .bubble{box-shadow:0 0 0 2.5px var(--gold)}
.line .who{font-weight:700;font-size:.85rem;color:var(--muted);padding-top:12px;text-align:right}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:11px 15px;display:flex;flex-direction:column;gap:3px;cursor:pointer;text-align:left;width:100%}
.line.b .bubble{background:var(--green-soft);border-color:transparent}
.bubble .sr{font-size:1.08rem}
.bubble .fr{color:var(--muted)}
.bubble .hid{color:var(--muted);font-style:italic;font-size:.9rem}
@media (max-width:600px){.line{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}.line .who{grid-column:1 / -1;text-align:left;padding-top:0}}

/* Talk */
.talk-log{display:flex;flex-direction:column;gap:14px}
.msg{max-width:88%;display:flex;flex-direction:column;gap:6px;padding:13px 16px;border-radius:16px}
.msg.me{align-self:flex-end;background:var(--green);color:var(--on-green);border-radius:16px 4px 16px 16px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 16px}
.msg.ai .sr{font-size:1.1rem}
.msg .lbl{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.msg .tip{background:var(--gold-soft);border-radius:10px;padding:8px 11px;font-size:.95rem}
.composer{display:flex;gap:10px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:vertical;min-height:52px;max-height:200px;font:1.05rem/1.4 var(--font-body);padding:13px 15px;border-radius:13px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--fg)}
.composer textarea:focus{border-color:var(--green);outline:none}
.typing{color:var(--muted);font-style:italic}
.code-box{width:100%;min-width:0;resize:vertical;font:.8rem/1.4 var(--font-mono);padding:10px 12px;border-radius:11px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--fg);word-break:break-all}
.code-box:focus{border-color:var(--green);outline:none}

/* Dico */
.search{position:relative}
.search input{width:100%;font:600 1.1rem var(--font-body);padding:14px 16px;border-radius:13px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--fg)}
.search input:focus{border-color:var(--green);outline:none}

/* Culture */
.proverb{display:flex;flex-direction:column;gap:6px;padding:18px 20px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.proverb .sr{font-size:1.25rem;line-height:1.25}
.anthem{padding:22px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.anthem .sr{font-size:1.3rem;line-height:1.3}

/* Son */
.say{display:none;align-items:center;justify-content:center;width:34px;height:34px;flex:none;padding:0;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--green);cursor:pointer;vertical-align:middle}
.has-sound .say{display:inline-flex}
.say:hover{border-color:var(--green)}
.say.playing{background:var(--green);border-color:var(--green);color:var(--on-green)}
.say-all{display:none}
.has-sound .say-all{display:inline-flex}
.say-all.playing{background:var(--gold);color:#1a1405}
.srw{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.ex .say,.word .say{width:30px;height:30px}

/* Séance du jour */
.steps{list-style:none;margin:0;padding:0;display:flex;gap:8px;flex-wrap:wrap}
.steps li{display:flex;align-items:center;gap:7px;font-size:.85rem;font-weight:700;color:var(--muted);padding:4px 12px 4px 4px;border-radius:99px;background:var(--surface-2)}
.steps li span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--fg);font-size:.75rem}
.steps li.cur{background:var(--green-soft);color:var(--green)}
.steps li.cur span,.steps li.done span{background:var(--green);color:var(--on-green)}
.plan{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.plan li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:2px}
.plan li b{font-family:var(--font-display);font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.plan li .lnum{margin-bottom:4px}
@media (max-width:600px){.plan{grid-template-columns:minmax(0,1fr)}}
.example{display:flex;flex-direction:column;gap:3px;padding:10px 14px;border-radius:12px;background:var(--surface-2);text-align:left;width:100%;max-width:460px}
.example .lbl{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}

 { id:"l8", title:"Poser des questions", key:"San yu e du?",

 { id:"l9", title:"Articles et pluriel", key:"den oso",
   intro:"<b>a</b> = le, la. <b>den</b> = les. <b>wan</b> = un, une. Le nom lui-même ne change jamais : pas de « s » au pluriel.",
   sections:[
    { h:"Le, les, un", ex:[
      ["a oso","la maison"],
      ["den oso","les maisons"],
      ["wan oso","une maison"],
      ["Den pikin e prei.","Les enfants jouent."]
    ]},
    { h:"Parler en général : pas d'article", ex:[
      ["Mi lobi fisi.","J'aime le poisson."],
      ["Watra bun gi yu.","L'eau, c'est bon pour toi."]
    ]},
    { h:"Ce…-ci, ce…-là", p:"On garde l'article et on ajoute <b>disi</b> ou <b>dati</b> après le nom.", ex:[
      ["a buku disi","ce livre-ci"],
      ["den oso dati","ces maisons-là"]
    ]}
   ],
   tip:"<b>den</b> veut aussi dire « ils » et « leur » : seul le contexte tranche. <span class=\"sr\">den pikin</span> = « les enfants » ou « leurs enfants ».",
   quiz:[

 { id:"l10", title:"La possession", key:"mi oso",
   intro:"Le possesseur se place <b>devant</b> ce qu'il possède : <span class=\"sr\">mi oso</span> (ma maison), <span class=\"sr\">yu mama</span> (ta mère), <span class=\"sr\">en buku</span> (son livre).",
   sections:[

 { id:"l11", title:"Où ? Les prépositions de lieu", key:"na tapu a tafra",

   sections:[

    ]}},

    { h:"Unless, as long as, provided that", ex:[

      ["You can borrow it as long as you return it.","Tu peux l'emprunter du moment que tu le rends."]]}

    {q:"« À ta place, j'accepterais » :",o:["If I were you, I would accept.","If I would be you, I accept.","At your place, I would accept."]},
    {q:"« unless » veut dire :",o:["à moins que, sauf si","jusqu'à ce que","même si"]}

 { id:"e10", level:"B1", title:"La voix passive", key:"It was built in 1890.",
   intro:"<b>be</b> (au temps voulu) + participe passé. On l'emploie quand l'action compte plus que son auteur, très souvent à l'écrit. L'auteur est introduit par <b>by</b>.",
   sections:[
    { h:"En phrases", ex:[
      ["English is spoken here.","Ici, on parle anglais."],
      ["The bridge was built in 1890.","Le pont a été construit en 1890."],
      ["The meeting has been cancelled.","La réunion a été annulée."],
      ["The results will be announced tomorrow.","Les résultats seront annoncés demain."],
      ["The book was written by a Surinamese author.","Le livre a été écrit par un auteur surinamien."]]},
    { h:"Traduire le « on » français", p:"Le « on » se traduit très souvent par un passif.", ex:[
      ["I was told to wait.","On m'a dit d'attendre."],
      ["She is said to be very talented.","On dit qu'elle est très talentueuse."]]}
   ],
   quiz:[
    {q:"« Le pont a été construit en 1890 » :",o:["The bridge was built in 1890.","The bridge has built in 1890.","The bridge was build in 1890."]},
    {q:"« On m'a dit d'attendre » :",o:["I was told to wait.","One told me to wait.","I told to wait."]},
    {q:"« La réunion a été annulée » :",o:["The meeting has been cancelled.","The meeting has cancelled.","The meeting is been cancelled."]}
   ]},
 { id:"e11", level:"B2", title:"Le discours indirect", key:"She said that…",
   intro:"Pour rapporter des paroles, on recule souvent d'un temps (présent → prétérit, prétérit → past perfect, will → would) et on adapte les pronoms et les repères de temps.",
   sections:[
    { h:"Rapporter une affirmation", ex:[
      ["She said she was tired.","Elle a dit qu'elle était fatiguée (« I'm tired »)."],
      ["He told me he would call.","Il m'a dit qu'il appellerait (« I'll call »)."],
      ["They said they had finished.","Ils ont dit qu'ils avaient fini (« We've finished »)."]]},
    { h:"Rapporter une question : ordre affirmatif", p:"Dans une question rapportée, pas d'inversion et pas de do.", ex:[
      ["She asked me where I lived.","Elle m'a demandé où j'habitais."],
      ["He asked if I was ready.","Il m'a demandé si j'étais prêt(e)."]]},
    { h:"Say ou tell ?", p:"<b>tell</b> est suivi de la personne : <i>tell me</i>. <b>say</b> ne l'est pas : <i>say that…</i>, <i>say something to me</i>.", ex:[
      ["She told me the truth.","Elle m'a dit la vérité."],
      ["She said goodbye.","Elle a dit au revoir."]]}
   ],
   quiz:[
    {q:"« Elle m'a demandé où j'habitais » :",o:["She asked me where I lived.","She asked me where did I live.","She asked me where do I live."]},
    {q:"« Il m'a dit qu'il appellerait » :",o:["He told me he would call.","He said me he would call.","He told he will call."]},
    {q:"« Il m'a demandé si j'étais prêt » :",o:["He asked if I was ready.","He asked if was I ready.","He asked that I was ready."]}
   ]},
 { id:"e12", level:"B1", title:"Les propositions relatives", key:"the man who…",
   intro:"<b>who</b> pour les personnes, <b>which</b> pour les choses, <b>that</b> pour les deux (dans les relatives essentielles), <b>whose</b> = dont (possession), <b>where</b> = où.",
   sections:[
    { h:"En phrases", ex:[
      ["The woman who lives next door is a nurse.","La femme qui habite à côté est infirmière."],
      ["The book that I bought is great.","Le livre que j'ai acheté est génial."],
      ["That's the man whose car was stolen.","C'est l'homme dont la voiture a été volée."],
      ["This is the house where I grew up.","C'est la maison où j'ai grandi."]]},
    { h:"Avec ou sans virgules", p:"Entre virgules, la relative ajoute une information accessoire : on ne peut pas y employer <b>that</b>.", ex:[
      ["My brother, who lives in Amsterdam, is a teacher.","Mon frère, qui vit à Amsterdam, est professeur."]]},
    { h:"Le pronom peut disparaître", p:"Quand il est complément, on l'omet souvent, surtout à l'oral.", ex:[
      ["The film we saw was boring.","Le film que nous avons vu était ennuyeux."]]}
   ],
   quiz:[
    {q:"« C'est l'homme dont la voiture a été volée » :",o:["That's the man whose car was stolen.","That's the man who car was stolen.","That's the man which car was stolen."]},
    {q:"« Mon frère, qui vit à Amsterdam, … » :",o:["My brother, who lives in Amsterdam, …","My brother, that lives in Amsterdam, …","My brother, which lives in Amsterdam, …"]},
    {q:"« C'est la maison où j'ai grandi » :",o:["This is the house where I grew up.","This is the house which I grew up.","This is the house where I grow up."]}
   ]},
 { id:"e13", level:"B2", title:"Gérondif ou infinitif ?", key:"I enjoy reading.",
   intro:"Après certains verbes, on met <b>-ing</b> ; après d'autres, <b>to</b> + verbe. Il faut les apprendre, et quelques verbes changent de sens selon la construction.",
   sections:[
    { h:"Verbes suivis de -ing", p:"enjoy, avoid, mind, finish, suggest, consider, keep, look forward to…", ex:[
      ["I enjoy reading.","J'aime lire."],
      ["Would you mind waiting?","Ça vous dérangerait d'attendre ?"],
      ["I'm looking forward to seeing you.","J'ai hâte de te voir."]]},
    { h:"Verbes suivis de to", p:"want, decide, hope, plan, refuse, agree, promise, manage, afford…", ex:[
      ["I decided to leave.","J'ai décidé de partir."],
      ["She managed to finish on time.","Elle a réussi à finir à temps."]]},
    { h:"Le sens change", ex:[
      ["I stopped smoking.","J'ai arrêté de fumer."],
      ["I stopped to smoke.","Je me suis arrêté(e) pour fumer."],
      ["Remember to call her.","Pense à l'appeler."],
      ["I remember calling her.","Je me souviens de l'avoir appelée."]]},
    { h:"Après une préposition : toujours -ing", ex:[
      ["She left without saying goodbye.","Elle est partie sans dire au revoir."],
      ["I'm interested in learning Sranan.","Ça m'intéresse d'apprendre le sranan."]]}
   ],
   quiz:[
    {q:"« J'aime lire » :",o:["I enjoy reading.","I enjoy to read.","I enjoy read."]},
    {q:"« J'ai arrêté de fumer » :",o:["I stopped smoking.","I stopped to smoke.","I stopped smoke."]},
    {q:"« Elle est partie sans dire au revoir » :",o:["She left without saying goodbye.","She left without to say goodbye.","She left without say goodbye."]},
    {q:"« J'ai décidé de partir » :",o:["I decided to leave.","I decided leaving.","I decided leave."]}
   ]},
 { id:"e14", level:"B1", title:"Les articles : a, the ou rien ?", key:"Life is beautiful.",
   intro:"Contrairement au français, l'anglais n'emploie pas <b>the</b> pour parler en général.",
   sections:[
    { h:"Généralités : pas d'article", ex:[
      ["Life is beautiful.","La vie est belle."],
      ["I love music.","J'adore la musique."],
      ["Dogs are loyal.","Les chiens sont fidèles."]]},
    { h:"the : quelque chose de précis", ex:[
      ["The music in this film is amazing.","La musique de ce film est incroyable."],
      ["Can you close the door?","Peux-tu fermer la porte ?"]]},
    { h:"a / an, et les métiers", p:"<b>an</b> devant un son voyelle : an hour, an apple (mais a university). Les métiers prennent l'article : <span class='sr'>She's a doctor.</span>", ex:[
      ["She's a doctor.","Elle est médecin."],
      ["It takes an hour.","Ça prend une heure."]]}
   ],
   tip:"Pas d'article non plus devant les langues, la plupart des pays, et <i>next / last</i> : <span class='sr'>I speak English.</span> <span class='sr'>See you next week.</span>",
   quiz:[
    {q:"« La vie est belle » :",o:["Life is beautiful.","The life is beautiful.","A life is beautiful."]},
    {q:"« Elle est médecin » :",o:["She's a doctor.","She's doctor.","She's the doctor."]},
    {q:"« Ça prend une heure » :",o:["It takes an hour.","It takes a hour.","It takes the hour."]},
    {q:"« J'adore la musique » (en général) :",o:["I love music.","I love the music.","I love a music."]}
   ]},
 { id:"e15", level:"A2", title:"Dénombrables et indénombrables", key:"much · many · advice",
   intro:"Certains noms ne se comptent pas en anglais, alors qu'ils se comptent en français : ils n'ont pas de pluriel et ne prennent pas <b>a</b>.",
   sections:[
    { h:"Les indénombrables pièges", ex:[
      ["some advice","des conseils (a piece of advice = un conseil)"],
      ["information","des informations"],
      ["news","des nouvelles (the news is good)"],
      ["furniture","des meubles"],
      ["luggage","des bagages"],
      ["homework","des devoirs"]]},
    { h:"much / many, little / few", p:"<b>many</b> et <b>few</b> avec les dénombrables ; <b>much</b> et <b>little</b> avec les indénombrables ; <b>a lot of</b> avec les deux.", ex:[
      ["How many people came?","Combien de personnes sont venues ?"],
      ["How much time do we have?","Combien de temps avons-nous ?"],
      ["There's little hope.","Il y a peu d'espoir."],
      ["I have a few friends here.","J'ai quelques amis ici."]]}
   ],
   quiz:[
    {q:"« Peux-tu me donner un conseil ? » :",o:["Can you give me some advice?","Can you give me an advice?","Can you give me some advices?"]},
    {q:"« Combien de temps avons-nous ? » :",o:["How much time do we have?","How many time do we have?","How many times do we have?"]},
    {q:"« Les nouvelles sont bonnes » :",o:["The news is good.","The news are good.","The new are good."]}
   ]},
 { id:"e16", level:"A2", title:"Comparer", key:"bigger · the most…",
   intro:"Adjectif court : <b>-er</b> / <b>the -est</b>. Adjectif long : <b>more</b> / <b>the most</b>. Égalité : <b>as … as</b>.",
   sections:[
    { h:"En phrases", ex:[
      ["She is taller than her brother.","Elle est plus grande que son frère."],
      ["This is the cheapest option.","C'est l'option la moins chère."],
      ["It's more expensive than I thought.","C'est plus cher que je ne pensais."],
      ["He's as tall as me.","Il est aussi grand que moi."],
      ["It's not as easy as it looks.","Ce n'est pas aussi facile que ça en a l'air."]]},
    { h:"Les irréguliers", ex:[
      ["good, better, the best","bon, meilleur, le meilleur"],
      ["bad, worse, the worst","mauvais, pire, le pire"],
      ["far, further, the furthest","loin, plus loin, le plus loin"]]},
    { h:"Plus…, plus…", ex:[
      ["The more you practise, the better you get.","Plus tu t'entraînes, meilleur tu deviens."]]}
   ],
   quiz:[
    {q:"« plus cher que » :",o:["more expensive than","expensiver than","more expensive that"]},
    {q:"« le pire » :",o:["the worst","the baddest","the most bad"]},
    {q:"« aussi grand que moi » :",o:["as tall as me","so tall than me","as tall than me"]}
   ]},
 { id:"e17", level:"B2", title:"Used to, be used to, get used to", key:"I'm used to it.",
   intro:"Trois expressions proches, trois sens différents.",
   sections:[
    { h:"En phrases", ex:[

      ["Did you use to play football?","Tu jouais au foot, avant ?"],
      ["I'm used to getting up early.","J'ai l'habitude de me lever tôt."],

    {q:"« J'ai l'habitude de me lever tôt » :",o:["I'm used to getting up early.","I used to get up early.","I'm used to get up early."]},

 { id:"e18", level:"B2", title:"Souhaits et regrets", key:"I wish I had…",
   intro:"<b>wish</b> et <b>if only</b> sont suivis d'un temps du passé : prétérit pour un regret présent, past perfect pour un regret passé, <b>would</b> pour un agacement envers quelqu'un.",
   sections:[
    { h:"wish, if only", ex:[
      ["I wish I had more time.","J'aimerais avoir plus de temps."],
      ["I wish I had listened to you.","Si seulement je t'avais écouté(e)."],
      ["If only it would stop raining!","Si seulement il pouvait arrêter de pleuvoir !"],
      ["I wish you wouldn't interrupt me.","J'aimerais que tu arrêtes de m'interrompre."]]},
    { h:"I'd rather, it's time", ex:[
      ["I'd rather stay here.","Je préférerais rester ici."],
      ["I'd rather you didn't tell her.","Je préférerais que tu ne lui dises pas."],
      ["It's time we left.","Il est temps que nous partions."]]}
   ],

    {q:"« Si seulement je t'avais écouté » :",o:["I wish I had listened to you.","I wish I listened you.","I wish I would listen to you."]},

 { id:"e19", level:"B2", title:"Question tags et réponses courtes", key:"…, isn't it?",
   intro:"Le « n'est-ce pas ? » anglais reprend l'auxiliaire de la phrase : affirmation → tag négatif, négation → tag positif.",
   sections:[
    { h:"Les tags", ex:[
      ["It's cold, isn't it?","Il fait froid, n'est-ce pas ?"],
      ["You live here, don't you?","Tu habites ici, n'est-ce pas ?"],
      ["She can't swim, can she?","Elle ne sait pas nager, si ?"],
      ["They've left, haven't they?","Ils sont partis, non ?"],
      ["Let's go, shall we?","On y va ?"]]},
    { h:"Les réponses courtes", p:"On répond rarement par yes ou no seul : on reprend l'auxiliaire.", ex:[
      ["Do you like it? Yes, I do.","Ça te plaît ? Oui."],
      ["Have you finished? No, I haven't.","Tu as fini ? Non."]]}
   ],
   tip:"Exception à connaître : <span class='sr'>I'm right, aren't I?</span>",
   quiz:[
    {q:"« Tu habites ici, n'est-ce pas ? » :",o:["You live here, don't you?","You live here, isn't it?","You live here, doesn't you?"]},
    {q:"« Il fait froid, n'est-ce pas ? » :",o:["It's cold, isn't it?","It's cold, is it?","It's cold, doesn't it?"]},
    {q:"« J'ai raison, non ? » :",o:["I'm right, aren't I?","I'm right, amn't I?","I'm right, isn't it?"]}
   ]},
 { id:"e20", level:"C1", title:"Inversion et mise en relief", key:"Never have I…",
   intro:"Pour un anglais soutenu et percutant : après un adverbe négatif placé en tête, on inverse sujet et auxiliaire. Pour insister, on emploie les phrases clivées.",
   sections:[
    { h:"L'inversion", ex:[
      ["Never have I seen such a mess.","Jamais je n'ai vu un tel désordre."],
      ["Not only did she win, but she also broke the record.","Non seulement elle a gagné, mais elle a aussi battu le record."],
      ["No sooner had I arrived than it started to rain.","À peine étais-je arrivé(e) qu'il s'est mis à pleuvoir."],
      ["Rarely do we get such an opportunity.","Il est rare qu'on ait une telle occasion."],
      ["Had I known, I would have stayed.","Si j'avais su, je serais resté(e)."],
      ["Should you need help, call me.","Si vous avez besoin d'aide, appelez-moi."]]},
    { h:"La mise en relief", ex:[
      ["What I need is a holiday.","Ce dont j'ai besoin, ce sont des vacances."],
      ["It was Anna who told me.","C'est Anna qui me l'a dit."],
      ["The thing is, I don't have time.","Le problème, c'est que je n'ai pas le temps."]]}
   ],
   tip:"À l'oral courant, ces tournures sonnent soutenues : elles brillent surtout à l'écrit, en entretien et en présentation.",
   quiz:[
    {q:"« Jamais je n'ai vu un tel désordre » :",o:["Never have I seen such a mess.","Never I have seen such a mess.","Never did I have seen such a mess."]},
    {q:"« À peine étais-je arrivé qu'il s'est mis à pleuvoir » :",o:["No sooner had I arrived than it started to rain.","No sooner I had arrived than it started to rain.","No sooner had I arrived when it started to rain."]},
    {q:"« Si vous avez besoin d'aide, appelez-moi » (soutenu) :",o:["Should you need help, call me.","Would you need help, call me.","Should you needed help, call me."]},
    {q:"« C'est Anna qui me l'a dit » :",o:["It was Anna who told me.","It's Anna which told me.","This is Anna who told me."]}
   ]},
 { id:"e21", level:"A2", title:"Prépositions de temps et de lieu", key:"in · on · at",

function lev(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({length: n + 1}, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));

/* Prononciation approchée, écrite pour un lecteur francophone */
const KEEP = new Set(["daisy","rayan","wilma","anna","ronald","amsterdam"]); // prénoms et noms étrangers : lus tels quels
function pron(s) {
  return String(s).replace(/[A-Za-zÀ-ÿ]+/g, w => KEEP.has(w.toLowerCase()) ? w.toLowerCase() : pronWord(w)).replace(/[?!.]+$/,"").trim();
}
function pronWord(s) {
  const t = String(s).toLowerCase(), isV = ch => ch !== "" && "aeiou".includes(ch);
  let out = "";
  for (let i = 0; i < t.length; i++) {
    const c = t[i], n = t[i + 1] || "", p = t[i - 1] || "", two = c + n;
    const MAP2 = {sy:"ch", ty:"tch", dy:"dj", ny:"gn", ai:"aï", ei:"éï", oi:"oï", ui:"ouï", au:"aou"};
    if (MAP2[two]) { out += MAP2[two]; i++; continue; }
    if (c === "u" || c === "w") { out += "ou"; continue; }
    if (c === "e") { out += "é"; continue; }
    if (c === "j") { out += "dj"; continue; }
    if (c === "s" && isV(p) && isV(n)) { out += "ss"; continue; }
    if (c === "g" && (n === "e" || n === "i")) { out += "gu"; continue; }
    if (c === "n" && p === "i" && !(isV(n) || n === "y")) { out += "nn"; continue; }
    out += c;
  }
  return out;
}
/* Texte lu à voix haute : la prononciation approchée, avec la ponctuation finale pour l'intonation */
function pronSpeak(s) {
  const t = String(s).trim();

/* ---------- Progression (navigateur + compte Claude si disponible) ---------- */
const LS_KEY = "leri-sranantongo:v1";
function fresh() { return {v:1, epoch:0, updatedAt:0, xp:0, goal:50, newPer:10, dir:"sr", slow:false, autoplay:false, course:"sr", enLevel:"", cards:{}, lessons:{}, dialogues:{}, days:{}, seances:{}}; }
/* Toute progression chargée (navigateur, compte, code de sauvegarde) est vérifiée champ par champ :
   seuls les champs connus, avec des nombres valides, sont gardés. */
const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
const num = (x, d = 0) => (typeof x === "number" && isFinite(x)) ? x : d;
const plainObj = o => (o && typeof o === "object" && !Array.isArray(o)) ? o : {};
const DATE_KEY = /^\d{4}-\d{2}-\d{2}$/;
const SEANCE_KEY = /^(en:)?\d{4}-\d{2}-\d{2}$/;
function normalizeState(x) {
  const f = fresh();
  if (!x || typeof x !== "object" || Array.isArray(x)) return f;
  f.epoch = num(x.epoch); f.updatedAt = num(x.updatedAt); f.xp = Math.max(0, Math.round(num(x.xp)));
  f.goal = [20, 50, 100, 200].includes(x.goal) ? x.goal : 50;
  f.newPer = [0, 5, 10, 20].includes(x.newPer) ? x.newPer : 10;
  f.dir = ["sr", "fr", "mix"].includes(x.dir) ? x.dir : "sr";
  f.slow = x.slow === true; f.autoplay = x.autoplay === true;
  f.course = ["sr", "en"].includes(x.course) ? x.course : "sr";
  f.enLevel = ["A1", "A2", "B1", "B2", "C1"].includes(x.enLevel) ? x.enLevel : "";
  for (const [k, c] of Object.entries(plainObj(x.cards))) {
    if (!own(BYID, k) || !c || typeof c !== "object") continue;
    f.cards[k] = {b: Math.min(5, Math.max(0, Math.round(num(c.b)))), d: num(c.d), l: num(c.l), r: Math.max(0, Math.round(num(c.r))), w: Math.max(0, Math.round(num(c.w)))};
  }
  for (const [k, l] of Object.entries(plainObj(x.lessons))) {
    if (!own(LESSON, k) || !l || typeof l !== "object") continue;
    f.lessons[k] = {score: Math.max(0, Math.round(num(l.score))), total: Math.max(0, Math.round(num(l.total))), at: num(l.at)};
  }
  for (const k of Object.keys(plainObj(x.dialogues))) if (own(DIALOGUE, k) || k === "lecture" || k === "en-lecture") f.dialogues[k] = true;
  for (const [k, v] of Object.entries(plainObj(x.days))) if (DATE_KEY.test(k)) f.days[k] = Math.max(0, Math.round(num(v)));
  for (const [k, v] of Object.entries(plainObj(x.seances))) if (SEANCE_KEY.test(k)) f.seances[k] = Math.max(0, Math.round(num(v)));
  return f;
}

/* Code de sauvegarde : « LERI1: » + la progression en base64 */
const BACKUP_PREFIX = "LERI1:";
function toBase64(str) { const bytes = new TextEncoder().encode(str); let bin = ""; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); }

function readBackup(text) {
  const t = String(text || "").replace(/\s+/g, "");

  if (t.length > 2000000) return null;
  try { return JSON.parse(fromBase64(t.slice(BACKUP_PREFIX.length))); } catch (e) { return null; }
}
function loadLocal() { try { const s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} }
S = normalizeState(loadLocal());

function merge(a, b) {
  a = normalizeState(a); b = normalizeState(b);
  if ((a.epoch || 0) !== (b.epoch || 0)) return (a.epoch || 0) > (b.epoch || 0) ? a : b;
  const newer = (b.updatedAt || 0) > (a.updatedAt || 0) ? b : a;
  const m = fresh();
  m.epoch = a.epoch || 0;
  m.updatedAt = Math.max(a.updatedAt || 0, b.updatedAt || 0);
  m.xp = Math.max(a.xp || 0, b.xp || 0);
  m.goal = newer.goal; m.newPer = newer.newPer; m.dir = newer.dir; m.slow = !!newer.slow; m.autoplay = !!newer.autoplay;
  m.course = newer.course; m.enLevel = newer.enLevel || a.enLevel || b.enLevel;
  for (const k of new Set([...Object.keys(a.cards), ...Object.keys(b.cards)])) {
    const x = a.cards[k], y = b.cards[k];
    m.cards[k] = !x ? y : !y ? x : ((y.l || 0) > (x.l || 0) ? y : x);
  }
  for (const k of new Set([...Object.keys(a.lessons), ...Object.keys(b.lessons)])) {
    const x = a.lessons[k], y = b.lessons[k];
    m.lessons[k] = !x ? y : !y ? x : ((y.score || 0) >= (x.score || 0) ? y : x);
  }
  for (const k of new Set([...Object.keys(a.dialogues), ...Object.keys(b.dialogues)])) m.dialogues[k] = true;
  for (const k of new Set([...Object.keys(a.days), ...Object.keys(b.days)])) m.days[k] = Math.max(a.days[k] || 0, b.days[k] || 0);
  for (const k of new Set([...Object.keys(a.seances), ...Object.keys(b.seances)])) m.seances[k] = Math.max(a.seances[k] || 0, b.seances[k] || 0);
  return m;
}

const sync = {ref: null, state: "local", writing: false, again: false, disabled: false, timer: null};
function setSync(st) {
  sync.state = st;
  const label = {local:"Enregistré sur cet appareil", connecting:"Synchronisation…", slow:"Synchronisation lente…", synced:"Synchronisé avec votre compte", error:"Hors ligne · enregistré ici"}[st];
  document.querySelectorAll(".sync").forEach(b => { b.dataset.s = st; const sp = b.querySelector("span"); if (sp) sp.textContent = label; b.title = label; });
}
function save() {
  S.updatedAt = Date.now();
  const cutoff = ymd(new Date(Date.now() - 400 * DAY));
  for (const k of Object.keys(S.days)) if (k < cutoff) delete S.days[k];
  for (const k of Object.keys(S.seances)) if (k.replace(/^en:/, "") < cutoff) delete S.seances[k];
  saveLocal();
  clearTimeout(sync.timer); sync.timer = setTimeout(pushRemote, 1200);
}
async function pushRemote() {
  if (!sync.ref || sync.disabled) return;
  if (sync.writing) { sync.again = true; return; }
  sync.writing = true;
  try { await sync.ref.set({json: JSON.stringify(S), updatedAt: S.updatedAt}); setSync("synced"); }
  catch (e) {
    if (e && e.code === "invalid_argument") { sync.disabled = true; setSync("local"); }
    else setSync("error");

  if (sync.again) { sync.again = false; pushRemote(); }
}
async function initRemote() {

    if (!user || !db) return;
    const id = await user.id();
    if (!id) return;
    sync.ref = db.doc("data/users/" + id + "/progress");
    setSync("connecting");
    let loaded = false;
    const slow = setTimeout(() => { if (!loaded) setSync("slow"); }, 10000);
    sync.ref.onSnapshot(snap => {
      if (!snap.metadata.fromCache) { loaded = true; clearTimeout(slow); }
      if (snap.exists) {
        const d = snap.data();
        try {

/* ---------- Son ----------
   Il n'existe pas de voix de synthèse pour le sranan : on fait lire la prononciation
   approchée par une voix française — voix Claude si la page y a accès, sinon la voix
   française du navigateur. */
const SOUND = {tts: null, voices: {}, off: false, reading: false, token: 0};
const VOICES = ["buttery", "airy", "glassy", "rounded"];
const PITCHES = [1, 1.25, 0.85, 1.12];
const ICON_SPEAK = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9.5v5h3.6l4.6 3.9V5.6L7.6 9.5z" fill="currentColor"/><path d="M15.6 9.2a4 4 0 0 1 0 5.6M18.2 6.6a7.6 7.6 0 0 1 0 10.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
const soundOn = () => !SOUND.off && !!(SOUND.tts || SOUND.voices[course().speech]);
function refreshSoundFlag() { document.documentElement.classList.toggle("has-sound", soundOn()); }
function pickVoice() {
  try {
    const vs = window.speechSynthesis.getVoices();
    SOUND.voices.fr = vs.find(v => /^fr[-_]FR/i.test(v.lang)) || vs.find(v => /^fr/i.test(v.lang)) || null;
    SOUND.voices.en = vs.find(v => /^en[-_]GB/i.test(v.lang)) || vs.find(v => /^en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  } catch (e) { SOUND.voices = {}; }
  refreshSoundFlag();
}
if ("speechSynthesis" in window) { pickVoice(); try { window.speechSynthesis.addEventListener("voiceschanged", pickVoice); } catch (e) {} }
function updateSayAll() {
  const b = $("#say-all"); if (!b) return;
  b.classList.toggle("playing", SOUND.reading);
  b.innerHTML = ICON_SPEAK + (SOUND.reading ? " Arrêter la lecture" : " Écouter tout");
}
function markPlaying(btn) {
  document.querySelectorAll(".say.playing").forEach(b => { b.classList.remove("playing"); b.setAttribute("aria-pressed", "false"); });
  if (btn && btn.classList.contains("say")) { btn.classList.add("playing"); btn.setAttribute("aria-pressed", "true"); }
}
function highlightLine(id) {
  document.querySelectorAll(".line.speaking").forEach(l => l.classList.remove("speaking"));
  if (id) { const el = document.getElementById(id); if (el) el.classList.add("speaking"); }
}
function soundIdle() { SOUND.reading = false; markPlaying(null); highlightLine(null); updateSayAll(); }
function stopSound() {
  SOUND.token++;

  else { try { window.speechSynthesis.cancel(); } catch (e) {} }
  soundIdle();
}
/* lines : [{text, voice?, pitch?, id?}] — à appeler directement depuis un clic ou une touche */
function speak(lines, btn, reading = false) {
  if (!soundOn() || !lines.length) return;
  const tok = ++SOUND.token;
  markPlaying(btn); SOUND.reading = reading; updateSayAll();
  if (SOUND.tts) {
    const payload = lines.map(l => { const o = {text: l.text, language: l.lang || "fr"}; if (l.voice) o.voice = l.voice; if (l.id) o.id = l.id; return o; });
    SOUND.tts.speak(payload, {rate: S.slow ? 0.75 : 0.95}).catch(e => {
      if (e && (e.code === "not_granted" || e.code === "unavailable")) { SOUND.off = true; refreshSoundFlag(); }
      if (e && e.code === "stopped" && e.reason === "replaced") return;
      if (tok === SOUND.token) soundIdle();
    });
    return;
  }
  try {
    const synth = window.speechSynthesis; synth.cancel();
    lines.forEach((l, i) => {
      const u = new SpeechSynthesisUtterance(l.text);
      const vo = SOUND.voices[l.lang || "fr"];
      if (vo) { u.voice = vo; u.lang = vo.lang; } else u.lang = l.lang || "fr";
      u.rate = S.slow ? 0.7 : 0.9; u.pitch = l.pitch || 1;
      u.onstart = () => { if (tok === SOUND.token) highlightLine(l.id || null); };
      if (i === lines.length - 1) u.onend = u.onerror = () => { if (tok === SOUND.token) soundIdle(); };
      synth.speak(u);
    });
  } catch (e) { soundIdle(); }
}
async function initTTS() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const t = await window.claude.use("tts");
    if (!t) return;
    SOUND.tts = t;
    try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {}
    t.onState(({state, reason}) => {
      if (state !== "idle" || reason === "replaced") return;
      if (reason === "not_granted" || reason === "unavailable") { SOUND.off = true; refreshSoundFlag(); }
      soundIdle();
    });
    t.onLine(({id}) => highlightLine(id || null));
  } catch (e) {}

  if (currentRoute() === "reglages") render();
}

  const now = Date.now();

  if (g === "good") { c.b = Math.min(5, c.b + 1); c.d = now + INTERVALS[c.b] * DAY; c.r++; if (xp) addXP(5); }
  else if (g === "hard") { c.b = Math.max(1, c.b); c.d = now + DAY; c.r++; if (xp) addXP(3); }

      ? (r < .35 ? "mc-sr" : r < .68 ? "mc-fr" : r < .88 ? "type" : r < .95 ? "order" : "marker")
      : (r < .3 ? "mc-sr" : r < .55 ? "mc-fr" : r < .72 ? "type" : r < .87 ? "order" : "marker");
    if ((type === "mc-sr" || type === "mc-fr" || type === "type") && wi >= list.length) type = Math.random() < .5 ? "order" : "marker";
    if (type === "order") {
      const [sr, fr] = pick(course().sentences);
      const toks = sr.replace(/[?!.]$/, "").replace(/,/g, "").split(" ");
      const extra = shuffle(course().fillers.filter(x => !toks.map(t => t.toLowerCase()).includes(x)))[0];
      qs.push({type, sr, fr, pool: shuffle(toks.concat(extra)), answer: norm(toks.join(" "))});
    } else if (type === "marker") {

    } else {

    else if (!c) S.cards[q.v.id] = {b: 1, d: Date.now() + DAY, l: Date.now(), r: 1, w: 0};
    else if (isDue(c)) grade(q.v.id, "good", false);
    else { c.r++; c.l = Date.now(); }
  }
  save();
}

  const plan = seancePlan();

  const fresh = courseVocab().filter(v => !card(v.id)).sort((a, b) => freshRank(a) - freshRank(b)).slice(0, plan.nNew).map(v => v.id);
  SE = {xp0: S.xp, rv: makeRV(due), learn: {ids: fresh, i: 0}, qz: null, steps: [], phase: ""};
  SE.steps = [due.length ? "review" : "", fresh.length ? "learn" : "", "quiz"].filter(Boolean);
  SE.phase = SE.steps[0];
  if (SE.phase === "quiz") SE.qz = seanceQuiz();
}
function seanceQuiz() {
  let ids = [...new Set([...SE.learn.ids, ...SE.rv.ids])];
  if (ids.length < 6) ids = [...new Set(ids.concat(shuffle(courseVocab().filter(v => card(v.id))).slice(0, 8).map(v => v.id)))];
  if (ids.length < 6) ids = [...new Set(ids.concat(courseVocab().slice(0, 10).map(v => v.id)))];
  return buildQuiz(ids.map(id => BYID[id]), 8, true);
}
function seanceAdvance() {
  const i = SE.steps.indexOf(SE.phase);

/* ---------- Dictionnaire ---------- */
let DQ = "";
function dicoResults(q) {
  const k = norm(q);
  let list = courseVocab().slice();
  if (k) {
    list = list.filter(v => norm(v.sr).includes(k) || norm(v.fr).includes(k));
    const rank = v => {
      const s = norm(v.sr), f = norm(v.fr), parts = v.fr.split(/[,;]/).map(norm);
      if (s === k || parts.includes(k)) return 0;
      if (s.startsWith(k) || parts.some(x => x.startsWith(k))) return 1;
      if (s.split(" ").includes(k) || f.split(" ").includes(k)) return 2;
      return 3;
    };
    list.sort((a, b) => rank(a) - rank(b) || a.sr.length - b.sr.length || a.sr.localeCompare(b.sr));
  } else list.sort((a, b) => norm(a.sr).localeCompare(norm(b.sr)));
  if (!list.length) return `<div class="empty">Aucun mot ne correspond à « ${esc(q)} ». Essayez un mot plus court, ou demandez dans <a href="#parler">Parler</a>.</div>`;
  let html = '<div class="list">', letter = "";
  for (const v of list) {
    if (!k) { const L = norm(v.sr)[0].toUpperCase(); if (L !== letter) { letter = L; html += `<div class="letter">${esc(L)}</div>`; } }
    html += wordRow(v, ` · <a href="#theme-${v.theme}">${esc(THEME[v.theme].name)}</a>`);
  }
  return html + "</div>";
}
function vDico() {
  return `<div class="stack-lg fade">
    <header class="stack" style="gap:8px"><p class="eyebrow">${cap(course().name)} ⇄ français</p><h1>Dictionnaire</h1></header>
    <div class="search"><label class="small muted" for="dico-q">Cherchez un mot ${course().inLang} ou en français</label>
      <input id="dico-q" type="search" autocomplete="off" spellcheck="false" placeholder="${course().dicoPlaceholder}" value="${esc(DQ)}"></div>
    <div id="dico-res">${dicoResults(DQ)}</div>
  </div>`;
}

    const re = new RegExp(label + "\\s*:\\s*([\\s\\S]*?)(?=\\n\\s*(?:" + next + ")\\s*:|$)", "i");
    const m = t.match(re); return m ? m[1].trim() : "";
  };
  const L = course().tutorLabel;
  const sr = get(L, "FRAN[ÇC]AIS|CONSEIL"), fr = get("FRAN[ÇC]AIS", "CONSEIL|" + L), tip = get("CONSEIL", L + "|FRAN[ÇC]AIS");
  return (sr || fr || tip) ? {sr, fr, tip} : null;
}

function talkErrCopy(code) {
  return ({
    rate_limited: "Trop de messages d'un coup, ou limite d'utilisation atteinte. Réessayez dans un moment.",
    session_expired: "Votre session a expiré : reconnectez-vous à claude.ai, puis réessayez.",
    refused: "Claude n'a pas répondu à ce message. Essayez de le formuler autrement.",
    empty_completion: "Réponse vide. Essayez une phrase plus simple.",
    prompt_too_large: "La conversation est devenue trop longue : commencez-en une nouvelle."
  })[code] || "La réponse a été interrompue. Renvoyez votre message pour réessayer.";
}
async function talkSend(text, hidden = false) {
  if (!SAMPLE || TALK.busy) return;
  text = text.trim(); if (!text) return;
  TALK.err = ""; TALK.partial = "";
  TALK.turns.push({role: "user", content: text, hidden});
  TALK.busy = true; TALK.ctl = new AbortController();
  refreshTalk();
  const recent = TALK.turns.slice(-16);
  while (recent.length && recent[0].role !== "user") recent.shift();
  const input = [{role: "user", content: talkRules()}].concat(recent.map(t => ({role: t.role, content: t.content})));
  try {
    const {text: out} = await SAMPLE(input, {cache: false, signal: TALK.ctl.signal, onText: ({text}) => { TALK.partial = text; refreshTalk(); }});
    TALK.turns.push({role: "assistant", content: out});
    addXP(2); save();
  } catch (e) {
    const code = e && e.code;
    if (code === "cancelled") { if (e.text) TALK.turns.push({role: "assistant", content: e.text}); }
    else if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code)) {
      TALK.off = code === "not_granted" ? "Vous n'avez pas autorisé cette page à utiliser Claude. Vous pouvez changer d'avis depuis le menu Permissions de la page, puis la recharger." : "Claude n'est pas disponible pour ce compte.";
    } else { if (e && e.text) TALK.turns.push({role: "assistant", content: e.text}); TALK.err = talkErrCopy(code); }
  }
  TALK.busy = false; TALK.partial = ""; TALK.ctl = null;
  if (TALK.off) { render(); return; }
  refreshTalk();
  const ta = $("#talk-in"); if (ta) ta.focus();
}
async function initSample() {
  if (!window.claude || typeof window.claude.use !== "function") { SAMPLE = null; return; }
  try { SAMPLE = await window.claude.use("sample"); } catch (e) { SAMPLE = null; }
  if (!SAMPLE) SAMPLE = null;
  if (currentRoute() === "parler") render();
}

function inSession() {
  const h = currentRoute();
  return (h === "reviser" && RV && RV.i < RV.ids.length) || (h === "seance" && SE) || (h === "exercices" && QZ) || h.startsWith("lecon-") || h === "parler" || h === "dico" || h.startsWith("dialogue-") || h === "niveau";
}
function softRender() { if (inSession()) renderNav(currentRoute()); else render(); }
window.addEventListener("hashchange", () => {
  DLG.shown = new Set(); RESET_ASK = false;
  if (SE && SE.phase === "done") SE = null; // une séance terminée laisse place à la suivante
  if (SHEET) setSheet(false);
  stopSound();
  render();
  window.scrollTo(0, 0);
  $("#view").focus({preventScroll: true});
});

/* ---------- Actions ---------- */
function afterReview(rv) {
  if (currentRoute() === "seance" && SE && rv.i >= rv.ids.length) seanceAdvance();
  render(); autoSay();
}
const ACT = {
  "go-settings": () => { location.hash = "reglages"; },
  "sheet": () => setSheet(!SHEET),
  "sheet-close": () => setSheet(false),
  "say": el => { if (el.classList.contains("playing")) { stopSound(); return; } speakFor(el.dataset.t, el); },
  "say-all": el => {
    if (SOUND.reading) { stopSound(); return; }
    const d = dialogueData(currentRoute().slice(9)); if (!d) return;
    const speakers = [...new Set(d.lines.map(l => l[0]))];
    speak(d.lines.map((l, i) => { const k = speakers.indexOf(l[0]); return {text: speechText(l[1]), lang: course().speech, voice: VOICES[k % VOICES.length], pitch: PITCHES[k % PITCHES.length], id: "dl-" + i}; }), el, true);
  },
  "rv-start": el => { startReview(el.dataset.theme); if (!RV.ids.length) RV = null; if (currentRoute() !== "reviser") location.hash = "reviser"; else { render(); autoSay(); } },
  "rv-reveal": () => { const rv = curRV(); rv.revealed = true; render(); autoSay(); },
  "rv-grade": el => {
    const rv = curRV(), id = rv.ids[rv.i], g = el.dataset.g;
    grade(id, g); rv.stats[g]++;
    if (g === "again" && !rv.requeued.has(id)) { rv.requeued.add(id); rv.ids.push(id); }
    rv.i++; rv.revealed = false; save(); afterReview(rv);
  },
  "rv-end": () => { RV = null; render(); },
  "se-start": () => { startSeance(); render(); autoSay(); },
  "se-quit": () => { SE = null; render(); },
  "se-learn-next": () => {
    const L = SE.learn, id = L.ids[L.i];
    if (!card(id)) { S.cards[id] = {b: 0, d: Date.now(), l: Date.now(), r: 0, w: 0}; addXP(2); save(); }
    L.i++;
    if (L.i >= L.ids.length) seanceAdvance();
    render(); autoSay();
  },
  "set-dir": el => { S.dir = el.dataset.v; save(); render(); },
  "set-new": el => { S.newPer = +el.dataset.v; save(); render(); },
  "set-goal": el => { S.goal = +el.dataset.v; save(); render(); },
  "set-slow": el => { S.slow = el.dataset.v === "1"; save(); render(); },
  "set-auto": () => { S.autoplay = !S.autoplay; save(); render(); },
  "qz-chip": el => { const t = el.dataset.theme; QSEL.has(t) ? QSEL.delete(t) : QSEL.add(t); render(); },
  "qz-all": () => { QSEL = new Set(THEMES.map(t => t.id)); render(); },
  "qz-none": () => { QSEL = new Set(); render(); },
  "qz-start": () => { QZ = buildQuiz(VOCAB.filter(v => QSEL.has(v.theme))); render(); },
  "qz-theme-start": el => { QSEL = new Set([el.dataset.theme]); QZ = buildQuiz(VOCAB.filter(v => QSEL.has(v.theme))); location.hash = "exercices"; },
  "qz-again": () => { QZ = buildQuiz(QZ.src, QZ.n, QZ.focus); render(); },
  "qz-setup": () => { QZ = null; render(); },
  "qz-opt": el => {
    const qz = curQZ(); if (!qz || qz.result) return;
    const q = qz.qs[qz.i], n = +el.dataset.n;
    qz.picked = n; quizAnswer(qz, q.options[n] === q.answer); render();
  },
  "qz-tok": el => { const qz = curQZ(); qz.built.push(+el.dataset.k); render(); },
  "qz-untok": el => { const qz = curQZ(); qz.built.splice(+el.dataset.n, 1); render(); },
  "qz-check": () => {
    const qz = curQZ(); if (!qz || qz.result) return;
    const q = qz.qs[qz.i];
    if (q.type === "type") { const inp = $("#qz-input"); qz.typed = inp ? inp.value : ""; if (!norm(qz.typed)) { if (inp) inp.focus(); return; } const r = checkTyped(q.v, qz.typed); quizAnswer(qz, r.ok, r.almost); }
    else if (q.type === "order") { quizAnswer(qz, norm(qz.built.map(k => q.pool[k]).join(" ")) === q.answer); }
    render();
  },
  "qz-skip": () => { const qz = curQZ(); const q = qz.qs[qz.i]; if (q.type === "type") { const inp = $("#qz-input"); qz.typed = inp ? inp.value : ""; } quizAnswer(qz, false); render(); },
  "qz-next": () => {
    const qz = curQZ();
    qz.i++; qz.picked = null; qz.result = null; qz.built = []; qz.typed = "";
    if (currentRoute() === "seance" && SE && qz.i >= qz.qs.length) seanceAdvance();
    render(); window.scrollTo(0, 0);
  },
  "ls-opt": el => {
    if (LQ.picked !== null) return;
    LQ.picked = +el.dataset.k; if (LQ.picked === 0) LQ.correct++;
    $("#lesson-quiz").innerHTML = lessonQuizHTML(LESSON[LQ.id]);
    const b = $('#lesson-quiz [data-act="ls-next"]'); if (b) b.focus({preventScroll: true});
  },
  "ls-next": () => {
    const l = LESSON[LQ.id];
    LQ.i++; LQ.picked = null;
    if (LQ.i >= l.quiz.length) {
      LQ.done = true;
      const prev = S.lessons[l.id];
      if (!prev) addXP(20 + 5 * LQ.correct);
      if (!prev || LQ.correct >= prev.score) S.lessons[l.id] = {score: LQ.correct, total: l.quiz.length, at: Date.now()};
      save(); renderNav(currentRoute());
    }
    $("#lesson-quiz").innerHTML = lessonQuizHTML(l);
    const first = $("#lesson-quiz .opt, #lesson-quiz .btn"); if (first) first.focus({preventScroll: true});
  },
  "ls-retry": () => { const id = LQ.id; LQ = {id, i: 0, picked: null, correct: 0, done: false, orders: LESSON[id].quiz.map(q => shuffle(q.o.map((_, k) => k)))}; $("#lesson-quiz").innerHTML = lessonQuizHTML(LESSON[id]); },
  "dl-line": el => { const i = +el.dataset.i; DLG.shown.has(i) ? DLG.shown.delete(i) : DLG.shown.add(i); stopSound(); render(); },
  "dl-tr": () => { DLG.tr = !DLG.tr; DLG.shown = new Set(); stopSound(); render(); },
  "dl-hide": () => { DLG.hide = !DLG.hide; DLG.shown = new Set(); stopSound(); render(); },
  "dl-done": el => { const id = el.dataset.id; if (!S.dialogues[id]) { S.dialogues[id] = true; addXP(10); save(); } render(); },
  "talk-scn": el => { if (TALK.busy) return; if (TALK.scn !== el.dataset.v) { TALK.scn = el.dataset.v; TALK.turns = []; TALK.err = ""; } render(); },
  "talk-send": () => { const ta = $("#talk-in"); if (!ta) return; const v = ta.value; ta.value = ""; talkSend(v); },
  "talk-start": () => talkSend("Commence la conversation selon le scénario, avec une première réplique très simple.", true),
  "talk-stop": () => { if (TALK.ctl) TALK.ctl.abort(); },
  "talk-new": () => { if (TALK.ctl) TALK.ctl.abort(); TALK.turns = []; TALK.err = ""; render(); },
  "backup-copy": () => {
    const code = backupCode(), msg = $("#backup-msg"), out = $("#backup-out");
    const showBox = () => { out.value = code; out.hidden = false; out.focus(); out.select(); msg.textContent = "Sélectionnez le code ci-dessous et copiez-le."; };
    try {
      navigator.clipboard.writeText(code).then(() => { msg.textContent = "Code copié. Collez-le dans vos notes pour le garder."; }, showBox);
    } catch (e) { showBox(); }
  },
  "restore": () => {
    const box = $("#restore-in"), msg = $("#restore-msg");
    const data = readBackup(box.value);
    if (!data) { msg.textContent = "Ce code n'est pas valide : il doit commencer par LERI1: et être copié en entier."; msg.style.color = "var(--red)"; return; }
    const imported = normalizeState(data);
    imported.epoch = S.epoch;
    S = merge(S, imported); save();
    box.value = "";
    msg.style.color = "var(--green)";
    msg.textContent = "Progression restaurée : " + Object.keys(imported.cards).length + " mots, " + Object.keys(imported.lessons).length + " leçons.";
    renderNav(currentRoute());
  },
  "course": el => {
    if (el.dataset.v === S.course) return;
    setCourse(el.dataset.v);
    if (routeCourse(currentRoute())) location.hash = "accueil"; else { render(); window.scrollTo(0, 0); }
  },
  "lt-start": () => { LT = {i: 0, answers: [], orders: EN_LEVELTEST.map(q => shuffle(q.o.map((_, k) => k)))}; render(); window.scrollTo(0, 0); },
  "lt-quit": () => { LT = null; render(); },
  "lt-opt": el => {
    if (!LT || LT.i >= EN_LEVELTEST.length) return;
    LT.answers[LT.i] = +el.dataset.k; LT.i++;
    if (LT.i >= EN_LEVELTEST.length) { S.enLevel = levelResult(LT.answers).level; addXP(20); save(); }
    render(); window.scrollTo(0, 0);
  },
  "reset-ask": () => { RESET_ASK = true; render(); },
  "reset-no": () => { RESET_ASK = false; render(); },
  "reset-yes": () => { const goal = S.goal; S = fresh(); S.epoch = Date.now(); S.goal = goal; RESET_ASK = false; RV = null; QZ = null; LQ = null; SE = null; save(); render(); }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener("input", e => {
  if (e.target.id === "dico-q") { DQ = e.target.value; const r = $("#dico-res"); if (r) r.innerHTML = dicoResults(DQ); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && SHEET) { e.preventDefault(); setSheet(false); const b = $('#tabbar [data-act="sheet"]'); if (b) b.focus(); return; }
  if (e.target.id === "qz-input" && e.key === "Enter") { e.preventDefault(); ACT["qz-check"](); return; }
  if (e.target.id === "talk-in" && e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ACT["talk-send"](); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || tag === "select") return;
  if (tag === "button" && (e.key === "Enter" || e.key === " ")) return; // le bouton s'en charge
  const h = currentRoute(), rv = curRV(), qz = curQZ();
  const reviewing = rv && rv.i < rv.ids.length && (h === "reviser" || (h === "seance" && SE && SE.phase === "review"));
  const quizzing = qz && qz.i < qz.qs.length && (h === "exercices" || (h === "seance" && SE && SE.phase === "quiz"));
  if (reviewing) {
    if (!rv.revealed && (e.key === " " || e.key === "Enter")) { e.preventDefault(); ACT["rv-reveal"](); }
    else if (rv.revealed && ["1","2","3"].includes(e.key)) { e.preventDefault(); ACT["rv-grade"]({dataset: {g: ["again","hard","good"][+e.key - 1]}}); }
  } else if (h === "seance" && SE && SE.phase === "learn" && (e.key === " " || e.key === "Enter")) {
    e.preventDefault(); ACT["se-learn-next"]();
  } else if (quizzing) {
    const q = qz.qs[qz.i];
    if (!qz.result && q.options && /^[1-4]$/.test(e.key) && +e.key <= q.options.length) { e.preventDefault(); ACT["qz-opt"]({dataset: {n: +e.key - 1}}); }
    else if (qz.result && e.key === "Enter") { e.preventDefault(); ACT["qz-next"](); }
  } else if (h === "niveau" && LT && LT.i < EN_LEVELTEST.length && /^[1-5]$/.test(e.key)) {
    e.preventDefault();
    ACT["lt-opt"]({dataset: {k: e.key === "5" ? -1 : LT.orders[LT.i][+e.key - 1]}});
  } else if (h.startsWith("lecon-") && LQ && !LQ.done && LQ.picked === null && /^[1-3]$/.test(e.key)) {
    const k = LQ.orders[LQ.i][+e.key - 1];
    if (k !== undefined) { e.preventDefault(); ACT["ls-opt"]({dataset: {k}}); }
  }
});

/* ---------- Installation sur l'écran d'accueil (version site uniquement) ----------
   Android / Chrome : le navigateur fournit une vraie invitation, déclenchée par le bouton « Installer ».
   iPhone / iPad : Apple ne permet pas à un site de lancer l'installation ; on explique quoi toucher. */
const INSTALL = {prompt: null};
const DISMISS_KEY = "leri-sranantongo:install-later";
const ICON_SHARE = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-label="(icône Partager)"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
const isStandalone = () => window.navigator.standalone === true || !!(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isSiteVersion = () => !!document.querySelector('link[rel="manifest"]') && window.top === window.self;
function installLater() { try { const t = +localStorage.getItem(DISMISS_KEY); return !!t && Date.now() - t < 7 * DAY; } catch (e) { return false; } }
function renderInstall() {
  const el = $("#install"); if (!el) return;
  const ios = isIOS() && !INSTALL.prompt;
  const show = currentRoute() === "accueil" && isSiteVersion() && !isStandalone() && !installLater() && (ios || !!INSTALL.prompt);
  el.hidden = !show;
  const view = $("#view");
  if (!show) { el.innerHTML = ""; view.style.setProperty("--install-h", "0px"); return; }
  const hasProgress = Object.keys(S.cards).length > 0 || Object.keys(S.lessons).length > 0;
  el.innerHTML = `<div class="install-card" role="region" aria-label="Installer l'application">
    <img src="icon-192.png" alt="" width="36" height="36">
    <div class="stack" style="gap:6px;min-width:0">
      <b>Installer sur l'écran d'accueil</b>
      ${ios
        ? `<span class="small">Touchez <b>Partager</b> ${ICON_SHARE} (ou <b>•••</b>), puis <b>« Sur l'écran d'accueil »</b>.${hasProgress ? " L'app installée repart de zéro : copiez d'abord votre progression." : ""}</span>`
        : `<span class="small">Elle s'ouvrira comme une application, même sans internet.</span>`}
      <div class="row">
        ${INSTALL.prompt ? `<button class="btn sm" type="button" data-act="install-now">Installer</button>` : ""}
        ${ios && hasProgress ? `<button class="btn sm" type="button" data-act="install-copy">Copier ma progression</button>` : ""}
        <button class="btn ghost sm" type="button" data-act="install-later">Plus tard</button>
      </div>
      <span class="small" id="install-msg" role="status"></span>
    </div>
  </div>`;
  view.style.setProperty("--install-h", (el.offsetHeight + 12) + "px"); // la page laisse de la place sous le bandeau
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); INSTALL.prompt = e; renderInstall(); });
window.addEventListener("appinstalled", () => { INSTALL.prompt = null; renderInstall(); });
Object.assign(ACT, {
  "install-now": () => {
    const ev = INSTALL.prompt; if (!ev) return;
    ev.prompt();
    Promise.resolve(ev.userChoice).catch(() => {}).then(() => { INSTALL.prompt = null; renderInstall(); });
  },
  "install-later": () => { try { localStorage.setItem(DISMISS_KEY, String(Date.now())); } catch (e) {} renderInstall(); },
  "install-copy": () => {
    const msg = $("#install-msg");
    const fail = () => { msg.textContent = "La copie n'a pas marché : copiez le code depuis Réglages → Sauvegarder ma progression."; };
    try {
      navigator.clipboard.writeText(backupCode()).then(() => { msg.textContent = "Progression copiée. Installez l'application, puis collez-la quand elle vous le propose."; }, fail);
    } catch (e) { fail(); }
  }
});

/* ---------- Démarrage ---------- */
render();
initRemote();
initSample();
initTTS();
})();
</script>
